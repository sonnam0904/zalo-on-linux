name: Release .deb

# Mỗi lần push lên main: phân tích commit theo chuẩn Conventional Commits
# (feat: / fix: / BREAKING CHANGE ...) để tự tính version mới, build .deb và
# đăng lên GitHub Releases. Không có commit đáng release thì bỏ qua.
#
# Quy ước commit:
#   feat: ...            -> tăng minor (1.2.0 -> 1.3.0)
#   fix:  ...            -> tăng patch (1.2.0 -> 1.2.1)
#   feat!: / BREAKING    -> tăng major (1.2.0 -> 2.0.0)
#   chore/docs/refactor  -> không release

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # cho phép chạy tay từ tab Actions

permissions:
  contents: write            # cần để tạo tag + release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (đầy đủ lịch sử để tính version)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tính version từ Conventional Commits
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false          # không có feat/fix -> không bump -> không release
          release_branches: main
          tag_prefix: v
          dry_run: true                # CHỈ tính version, KHÔNG tạo tag ở đây.
                                       # Tag được tạo cùng lúc với release ở bước dưới
                                       # (nguyên tử) -> không bị kẹt "tag mồ côi".

      - name: Không có gì để release
        if: steps.version.outputs.new_tag == ''
        run: echo "Không có commit feat/fix/breaking kể từ release trước — bỏ qua."

      - name: Cài Go
        if: steps.version.outputs.new_tag != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Kiểm tra glibc của SQLite binding
        if: steps.version.outputs.new_tag != ''
        # Binding build trên distro mới (glibc >= 2.38) không load được trên
        # Ubuntu 22.04 -> DB không mở, Zalo kẹt ngay sau đăng nhập.
        # Build lại bằng native/nativelibs/sqlite3/build-linux.sh.
        run: |
          f=native/nativelibs/sqlite3/binding/napi-v6-linux-x64/node_sqlite3.node
          need=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "$f cần GLIBC_$need"
          [ "$(printf '%s\n2.31\n' "$need" | sort -V | tail -1)" = "2.31" ] || { echo "::error::$f cần GLIBC_$need (> 2.31)"; exit 1; }

      - name: Build .deb
        if: steps.version.outputs.new_tag != ''
        run: |
          command -v rsync >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y rsync; }
          bash packaging/build-deb.sh "${{ steps.version.outputs.new_version }}"

      - name: Tạo GitHub Release + đính kèm .deb
        if: steps.version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.version.outputs.changelog }}
          files: dist/*.deb
          fail_on_unmatched_files: true
